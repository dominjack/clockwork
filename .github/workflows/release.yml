name: Release

on:
  push:
    tags:
      - "v*" # Triggers only when you push a tag like v1.0, v0.2.1, etc.

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: clockwork-linux
            asset_name: clockwork-linux
          - os: windows-latest
            artifact_name: clockwork-windows.exe
            asset_name: clockwork-windows.exe
          - os: macos-latest
            artifact_name: clockwork-mac
            asset_name: clockwork-mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build (Rust)
        run: cargo build --release
      - name: Rename Binary
        run: mv target/release/clockwork${{ matrix.os == 'windows-latest' && '.exe' || '' }} ${{ matrix.artifact_name }}

      - name: Upload Binary to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}
          overwrite: true