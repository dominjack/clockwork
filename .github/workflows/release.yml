name: Release

on:
  push:
    tags:
      - "v*" # Triggers on tags like v1.0.0, v0.2, etc.

permissions:
  contents: write # REQUIRED: Allows the action to create the release

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux Configuration
          - os: ubuntu-latest
            artifact_name: clockwork-linux
            original_name: clockwork
            
          # Windows Configuration
          - os: windows-latest
            artifact_name: clockwork-windows.exe
            original_name: clockwork.exe
            
          # Mac Configuration
          - os: macos-latest
            artifact_name: clockwork-mac
            original_name: clockwork

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Engine
        # Builds the binary in release mode (highly optimized)
        run: cargo build --release

      - name: Rename Binary
        shell: bash
        run: mv target/release/${{ matrix.original_name }} ${{ matrix.artifact_name }}

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}