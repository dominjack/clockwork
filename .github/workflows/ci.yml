name: ClockworkCI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Install Rust (Stable)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 2. Cache dependencies (Saves ~5-10 mins)
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 3. Check for compile errors (Faster than building)
      - name: Cargo Check
        run: cargo check --workspace --all-targets

      # 4. Run Tests
      - name: Run Tests
        run: cargo test --workspace