[package]
name = "chess_core"
version = "1.0.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3"
num-traits = "0.2.19"

rand = "0.9.1"
arrayvec = "0.7"
regex = "1"
thiserror = "2.0.17"
rayon = { version = "1.5", optional = true }

[dev-dependencies]
criterion = "0.7.0"

[build-dependencies]
rand = "0.9.1"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

